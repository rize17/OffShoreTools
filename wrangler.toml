# Deploy config for the API worker, at the REPO ROOT on purpose (the same
# arrangement as Ship ETA). Workers Builds pointed at the repo root with no
# config here would find index.html and deploy the landing page as a static
# site instead of the worker. Naming main here makes the build deploy the
# script whichever directory it starts from; worker/wrangler.toml says the
# same thing for a build rooted at worker/.
#
# No [assets] block: this worker serves no files, only JSON and screenshots.
# The landing page is on GitHub Pages.
#
# The KV id is an identifier, not a credential - safe in the repo. The keys
# are NOT here: VIEW_KEY and ADMIN_KEY are dashboard secrets, which a deploy
# leaves alone. Never add them to this file.

name = "offshoretools"
main = "worker/offshoretools-api.js"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "TOOLS"
id = "e3a28f1e18cd4ab2a09354be7366357a"
