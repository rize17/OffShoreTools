# never add VIEW_KEY or ADMIN_KEY to this file.

name = "offshoretools-api"
main = "offshoretools-api.js"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "TOOLS"
id = "PASTE_KV_NAMESPACE_ID_HERE"
