<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offshore Tools v1.6</title>

<!-- Add-to-Home-Screen support -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07131d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Offshore Tools">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  :root {
    --bg: #07131d;
    --panel: #0d1f2d;
    --panel-edge: #16324a;
    --ink: #d7e8f2;
    --ink-dim: #6d8ba0;
    --aqua: #38c8e8;
    --aqua-deep: #1596b8;
    --amber: #e8b638;
    --ok: #4fd08a;
    --err: #e86a5e;
    font-size: 16px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    background: radial-gradient(1200px 500px at 50% -200px, #0e2a3d 0%, var(--bg) 60%) var(--bg);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: max(env(safe-area-inset-top), 12px) 16px calc(env(safe-area-inset-bottom) + 28px);
    line-height: 1.45;
  }
  button, input, textarea { font: inherit; color: inherit; }

  header {
    max-width: 1100px; margin: 8px auto 20px;
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 1.6rem; letter-spacing: -0.01em; flex: 1; }
  header h1 .version { font-size: 0.75rem; font-weight: 400; color: var(--ink-dim); margin-left: 6px; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--panel-edge);
    font-size: 1.25rem; cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--aqua-deep); }

  main { max-width: 1100px; margin: 0 auto; }
  .status { color: var(--ink-dim); font-size: 0.85rem; min-height: 1.3em; margin-bottom: 12px; }
  .status.err { color: var(--err); }

  /* ---------- cards ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    gap: 18px;
  }
  .card {
    position: relative;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 16px; overflow: hidden;
    text-decoration: none; color: inherit;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  a.card:hover, a.card:focus-visible {
    transform: translateY(-3px); border-color: var(--aqua);
    box-shadow: 0 10px 30px rgba(0,0,0,.45); outline: none;
  }
  /* A fixed height, and the image taken out of the flow, so a tall phone
     screenshot can't stretch its card: the whole screenshot is scaled down
     to fit inside the box instead. */
  .shot {
    position: relative; flex: none;
    height: 240px; width: 100%; overflow: hidden;
    background: linear-gradient(135deg, #0e2a3d, #123a55);
    display: grid; place-items: center;
    font-size: 3.5rem; font-weight: 700; color: var(--aqua);
    border-bottom: 1px solid var(--panel-edge);
  }
  .shot:has(img) { background: var(--bg); }
  .shot img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; display: block;
  }
  /* Grows to fill the card, with the name and description at its foot, so
     they line up along the bottom of every card in a row. */
  .body {
    flex: 1; padding: 14px 16px 16px;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .body h2 { font-size: 1.15rem; margin-bottom: 4px; }
  .body p { color: var(--ink-dim); font-size: 0.92rem; }
  .edit {
    position: absolute; top: 10px; right: 10px;
    width: 40px; height: 40px; border-radius: 10px;
    background: rgba(7,19,29,.85); border: 1px solid var(--panel-edge);
    cursor: pointer; font-size: 1.05rem;
  }
  .edit:hover { border-color: var(--amber); }
  .move { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; }
  .move button {
    width: 40px; height: 40px; border-radius: 10px;
    background: rgba(7,19,29,.85); border: 1px solid var(--panel-edge);
    color: var(--aqua); cursor: pointer; font-size: 1rem;
  }
  .move button:hover:not(:disabled) { border-color: var(--aqua); }
  .move button:disabled { opacity: .3; cursor: default; }
  .add {
    border-style: dashed; cursor: pointer; min-height: 220px;
    align-items: center; justify-content: center; gap: 6px;
    color: var(--aqua); font-weight: 600; font-size: 1.05rem;
  }
  .add:hover { border-color: var(--aqua); }
  .add span { font-size: 2.4rem; line-height: 1; }
  .empty { color: var(--ink-dim); text-align: center; padding: 40px 0; }

  /* ---------- key gate ---------- */
  .gate {
    max-width: 420px; margin: 10vh auto 0; text-align: center;
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 18px; padding: 28px 22px;
  }
  .gate .big { font-size: 3rem; }
  .gate h2 { margin: 6px 0 6px; }
  .gate p { color: var(--ink-dim); margin-bottom: 18px; }

  /* ---------- forms & dialogs ---------- */
  label { display: block; font-size: 0.85rem; color: var(--ink-dim); margin: 12px 0 4px; }
  input[type=text], input[type=url], input[type=password], textarea {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    background: var(--bg); border: 1px solid var(--panel-edge);
  }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, textarea:focus { outline: 2px solid var(--aqua-deep); outline-offset: 0; }
  .btn {
    padding: 11px 18px; border-radius: 10px; cursor: pointer; font-weight: 600;
    background: var(--aqua-deep); border: 1px solid var(--aqua-deep); color: #fff;
  }
  .btn:hover { background: var(--aqua); border-color: var(--aqua); color: var(--bg); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--panel-edge); }
  .btn.ghost:hover { border-color: var(--ink-dim); color: var(--ink); }
  .btn.danger { background: transparent; color: var(--err); border-color: var(--err); }
  .btn.danger:hover { background: var(--err); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
  .row .spacer { flex: 1; }
  .msg { font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }

  dialog {
    width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--panel-edge); border-radius: 16px; padding: 22px;
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { font-size: 1.2rem; }
  .access { margin-top: 8px; color: var(--ink-dim); }
  .access b { color: var(--ink); }
  .access b.admin { color: var(--amber); }
  .toggle {
    display: flex; align-items: center; gap: 12px; margin: 16px 0 4px;
    padding: 12px 14px; border-radius: 10px; cursor: pointer;
    background: var(--bg); border: 1px solid var(--panel-edge);
    color: var(--ink); font-size: 1rem;
  }
  .toggle span { flex: 1; }
  .toggle small { color: var(--ink-dim); }
  .toggle input {
    appearance: none; -webkit-appearance: none; margin: 0; flex: none;
    width: 48px; height: 28px; border-radius: 14px; position: relative; cursor: pointer;
    background: var(--panel-edge); transition: background .15s;
  }
  .toggle input::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 22px; height: 22px; border-radius: 50%; background: var(--ink);
    transition: transform .15s;
  }
  .toggle input:checked { background: var(--amber); }
  .toggle input:checked::after { transform: translateX(20px); }
  .editing-badge {
    padding: 6px 10px; border-radius: 8px; cursor: pointer;
    background: transparent; border: 1px solid var(--amber); color: var(--amber);
    font-size: 0.8rem; font-weight: 600;
  }

  .preview {
    margin-top: 6px; height: 240px; border-radius: 10px; overflow: hidden;
    border: 1px dashed var(--panel-edge); background: var(--bg);
    display: grid; place-items: center; color: var(--ink-dim); font-size: 0.85rem;
    text-align: center; padding: 0;
  }
  .preview img { width: 100%; height: 100%; object-fit: contain; }
  .hint { font-size: 0.8rem; color: var(--ink-dim); margin-top: 6px; }
  [hidden] { display: none !important; }

  /* Phones: every card on one screen, no scrolling. Two columns, and the
     grid is sized to the space under the header, split into as many rows as
     there are cards (--rows, set by render()). Each row is capped at 230px,
     so a handful of apps doesn't blow up into giant cards. The screenshot
     takes whatever height is left after the name; descriptions are dropped
     to make room. */
  @media (max-width: 640px) {
    body {
      height: 100dvh; display: flex; flex-direction: column;
      padding-bottom: calc(env(safe-area-inset-bottom) + 12px);
    }
    header { width: 100%; margin: 4px auto 12px; }
    header h1 { font-size: 1.3rem; white-space: nowrap; }
    .editing-badge .word { display: none; }
    .icon-btn { width: 40px; height: 40px; }
    main, #tools { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; }
    .status:empty { display: none; }
    .grid {
      flex: 1 1 0; min-height: 0;
      max-height: calc(var(--rows, 4) * 230px);
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(var(--rows, 4), minmax(0, 1fr));
      gap: 10px;
    }
    .card { min-height: 0; border-radius: 12px; }
    .shot { flex: 1 1 0; height: auto; min-height: 0; font-size: 2.2rem; }
    .body { flex: none; padding: 8px 10px; }
    .body h2 { font-size: 0.95rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .body p { display: none; }
    .add { min-height: 0; font-size: 0.9rem; }
    .add span { font-size: 1.8rem; }
    .edit, .move button { width: 32px; height: 32px; border-radius: 8px; font-size: 0.85rem; }
    .edit { top: 6px; right: 6px; }
    .move { top: 6px; left: 6px; gap: 4px; }
  }
</style>
</head>
<body>

<header>
  <h1>⚓ Offshore Tools<span class="version">v1.6</span></h1>
  <button class="editing-badge" id="editingBadge" type="button" title="Turn edit mode off" hidden>✏️<span class="word"> Editing</span> ✕</button>
  <button class="icon-btn" id="openSettings" title="Settings" aria-label="Settings" hidden>⚙️</button>
</header>

<main>
  <!-- Shown until a working key has been entered on this device -->
  <section class="gate" id="gate" hidden>
    <div class="big">🔑</div>
    <h2>Enter your key</h2>
    <p>You only need to do this once on each device.</p>
    <form id="gateForm">
      <input type="password" id="gateKey" placeholder="Key" autocomplete="current-password" aria-label="Key">
      <div class="row"><span class="spacer"></span><button class="btn" type="submit">Unlock</button><span class="spacer"></span></div>
      <div class="msg err" id="gateMsg"></div>
    </form>
  </section>

  <section id="tools" hidden>
    <div class="status" id="status"></div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<!-- Settings -->
<dialog id="settings">
  <h2>⚙️ Settings</h2>
  <p class="access" id="access"></p>
  <label class="toggle" id="editToggleRow" hidden>
    <span>Edit mode<br><small>Add, edit, remove and reorder apps</small></span>
    <input type="checkbox" id="editToggle">
  </label>
  <form id="keyForm">
    <label for="newKey">Change key</label>
    <input type="password" id="newKey" placeholder="New key" autocomplete="off">
    <div class="msg" id="keyMsg"></div>
    <div class="row">
      <button class="btn danger" type="button" id="forget">Forget key on this device</button>
      <span class="spacer"></span>
      <button class="btn ghost" type="button" data-close>Close</button>
      <button class="btn" type="submit">Save key</button>
    </div>
  </form>
</dialog>

<!-- Add / edit a tool (admin key only) -->
<dialog id="editor">
  <h2 id="editorTitle">Add app</h2>
  <form id="toolForm">
    <label for="fName">Name</label>
    <input type="text" id="fName" maxlength="60" required>
    <label for="fUrl">Link</label>
    <input type="url" id="fUrl" placeholder="https://…" required>
    <label for="fDesc">Short description</label>
    <textarea id="fDesc" maxlength="200"></textarea>
    <label for="fIcon">Emoji (shown when there's no screenshot)</label>
    <input type="text" id="fIcon" maxlength="8" placeholder="e.g. 🚢">

    <label>Screenshot</label>
    <div class="preview" id="preview">No screenshot</div>
    <p class="hint">Choose an image, or copy a screenshot and paste it here (Ctrl/⌘+V).</p>
    <div class="row" style="margin-top:8px">
      <button class="btn ghost" type="button" id="pickImg">Choose image…</button>
      <button class="btn ghost" type="button" id="clearImg">Remove</button>
      <input type="file" id="fFile" accept="image/*" hidden>
    </div>

    <div class="msg" id="editMsg"></div>
    <div class="row">
      <button class="btn danger" type="button" id="delTool">Delete</button>
      <span class="spacer"></span>
      <button class="btn ghost" type="button" data-close>Cancel</button>
      <button class="btn" type="submit" id="saveTool">Save</button>
    </div>
  </form>
</dialog>

<script>
"use strict";

/* The API's address is in the code; the keys never are. The address is a
   public URL visible in the page source whatever we do. The keys are the only
   thing between the tool list and the internet, so they're typed once per
   device and kept in that device's storage. A stored offshoretools.apiUrl
   still wins if present - nothing sets it; it's for tests and emergencies. */
const API_URL = "https://offshoretools-api.ryantholliday.workers.dev";

const $ = id => document.getElementById(id);

/* ---------- storage (localStorage with in-memory fallback) ---------- */
const store = (() => {
  const mem = {};
  let ok = false;
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); ok = true; } catch (_) {}
  return {
    get(k, d) {
      try { const v = ok ? localStorage.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); }
      catch (_) { return d; }
    },
    set(k, v) {
      try { const s = JSON.stringify(v); if (ok) localStorage.setItem(k, s); else mem[k] = s; } catch (_) {}
    },
    del(k) { try { if (ok) localStorage.removeItem(k); else delete mem[k]; } catch (_) {} },
    keys() {
      try { return ok ? Object.keys(localStorage) : Object.keys(mem); } catch (_) { return []; }
    }
  };
})();

const K_KEY = "offshoretools.key";
const K_LIST = "offshoretools.list";      // last list seen, so the page opens instantly and works with no signal
const K_IMG = "offshoretools.img.";       // + tool id → { at, data } cached screenshot

const apiUrl = () => (String(store.get("offshoretools.apiUrl", "") || "") || API_URL).replace(/\/+$/, "");

let key = String(store.get(K_KEY, "") || "");
let list = store.get(K_LIST, null);        // { tools, role, updated }
let editing = null;                         // tool being edited, or null when adding
let pendingImage;                           // undefined = unchanged, null = remove, string = new data URL

class KeyRejected extends Error {}

async function api(path, method, body, useKey) {
  let r;
  try {
    r = await fetch(apiUrl() + path, {
      method: method || "GET",
      headers: { "X-API-Key": useKey || key, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (_) {
    throw new Error("couldn't reach the server - check your signal");
  }
  if (r.status === 401) throw new KeyRejected("that key wasn't accepted");
  let data = null;
  try { data = await r.clone().json(); } catch (_) {}
  if (!r.ok) throw new Error((data && data.error) || "the server answered " + r.status);
  return data || r;
}

/* ---------- screens ---------- */
function showGate(msg) {
  $("gate").hidden = false;
  $("tools").hidden = true;
  $("openSettings").hidden = true;
  $("gateMsg").textContent = msg || "";
  $("gateKey").value = "";
  setTimeout(() => $("gateKey").focus(), 0);
}

function showTools() {
  $("gate").hidden = true;
  $("tools").hidden = false;
  $("openSettings").hidden = false;
}

function setStatus(msg, isErr) {
  $("status").textContent = msg || "";
  $("status").classList.toggle("err", !!isErr);
}

const isAdmin = () => !!(list && list.role === "admin");

/* Edit mode is off on every load and never stored: even with the admin key,
   the page is the plain view until it's switched on in Settings. */
let editOn = false;
const canEdit = () => isAdmin() && editOn;

function setEdit(on) {
  editOn = !!on && isAdmin();
  $("editToggle").checked = editOn;
  $("editingBadge").hidden = !editOn;
  render();
}

/* ---------- rendering ---------- */
function shotFor(t) {
  const shot = document.createElement("div");
  shot.className = "shot";
  const cached = store.get(K_IMG + t.id, null);
  if (t.imgAt && cached && cached.at === t.imgAt) {
    const img = document.createElement("img");
    img.src = cached.data;
    img.alt = "";
    shot.append(img);
  } else {
    shot.textContent = t.icon || (t.name || "?").trim().charAt(0).toUpperCase();
  }
  return shot;
}

function render() {
  const grid = $("grid");
  grid.replaceChildren();
  const tools = (list && list.tools) || [];

  tools.forEach((t, i) => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = t.url;

    const body = document.createElement("div");
    body.className = "body";
    const h = document.createElement("h2");
    h.textContent = t.name;
    body.append(h);
    if (t.description) {
      const p = document.createElement("p");
      p.textContent = t.description;
      body.append(p);
    }
    a.append(shotFor(t), body);

    if (canEdit()) {
      const ed = document.createElement("button");
      ed.className = "edit";
      ed.type = "button";
      ed.title = "Edit " + t.name;
      ed.setAttribute("aria-label", "Edit " + t.name);
      ed.textContent = "✏️";
      ed.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); openEditor(t); });

      const mv = document.createElement("div");
      mv.className = "move";
      for (const [by, label, word] of [[-1, "◀", "earlier"], [1, "▶", "later"]]) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = label;
        btn.title = "Move " + word;
        btn.setAttribute("aria-label", "Move " + t.name + " " + word);
        btn.disabled = by < 0 ? i === 0 : i === tools.length - 1;
        btn.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); move(t, by); });
        mv.append(btn);
      }
      a.append(ed, mv);
    }
    grid.append(a);
  });

  if (canEdit()) {
    const add = document.createElement("button");
    add.className = "card add";
    add.type = "button";
    add.innerHTML = "<span>＋</span>Add app";
    add.addEventListener("click", () => openEditor(null));
    grid.append(add);
  }

  if (!tools.length && !canEdit()) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No apps have been added yet.";
    grid.append(p);
  }
  grid.style.setProperty("--rows", Math.max(1, Math.ceil(grid.children.length / 2)));
  $("editingBadge").hidden = !canEdit();
}

/* Screenshots are fetched with the key, so they can't be plain <img src>
   links. Each is cached against the time it was uploaded and only fetched
   again when that changes. */
async function fetchImages() {
  const tools = (list && list.tools) || [];
  const want = new Set(tools.map(t => K_IMG + t.id));
  for (const k of store.keys()) if (k.startsWith(K_IMG) && !want.has(k)) store.del(k);

  let changed = false;
  for (const t of tools) {
    const cached = store.get(K_IMG + t.id, null);
    if (!t.imgAt) { if (cached) { store.del(K_IMG + t.id); changed = true; } continue; }
    if (cached && cached.at === t.imgAt) continue;
    try {
      const r = await api("/img/" + encodeURIComponent(t.id));
      const data = await blobToDataUrl(await r.blob());
      store.set(K_IMG + t.id, { at: t.imgAt, data });
      changed = true;
    } catch (_) { /* the card keeps its emoji tile; try again next load */ }
  }
  if (changed) render();
}

function blobToDataUrl(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(blob);
  });
}

const when = ms => new Date(ms).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });

function takeList(data) {
  list = { tools: data.tools || [], role: data.role, updated: data.updated || 0 };
  store.set(K_LIST, list);
  render();
  fetchImages();
}

async function refresh() {
  if (!key) return showGate();
  if (list) { showTools(); render(); }
  setStatus(list ? "Updating…" : "Loading…");
  try {
    takeList(await api("/tools"));
    showTools();
    setStatus("");
  } catch (e) {
    if (e instanceof KeyRejected) {
      forget();
      return showGate("That key no longer works. Ask for the current one.");
    }
    if (list) setStatus("Offline - showing the list from " + when(list.updated || Date.now()) + ".", true);
    else { showTools(); setStatus("Couldn't load the apps: " + e.message + ".", true); }
  }
}

/* Shown moved straight away, then the worker's answer replaces it. The
   worker swaps by id, so two people moving at once can't lose a tool. */
async function move(t, by) {
  const tools = list.tools.slice();
  const at = tools.findIndex(x => x.id === t.id);
  const to = at + by;
  if (at < 0 || to < 0 || to >= tools.length) return;
  const before = list;
  [tools[at], tools[to]] = [tools[to], tools[at]];
  list = { ...list, tools };
  render();
  try {
    takeList(await api("/move/" + encodeURIComponent(t.id), "PUT", { by }));
    setStatus("");
  } catch (e) {
    list = before;
    render();
    setStatus("Couldn't move " + t.name + ": " + e.message + ".", true);
  }
}

function forget() {
  editOn = false;
  $("editingBadge").hidden = true;
  key = "";
  list = null;
  store.del(K_KEY);
  store.del(K_LIST);
  for (const k of store.keys()) if (k.startsWith(K_IMG)) store.del(k);
  $("grid").replaceChildren();
}

/* ---------- key entry ---------- */
async function tryKey(k, msgEl) {
  k = k.trim();
  if (!k) { msgEl.textContent = "Type the key first."; return false; }
  msgEl.className = "msg";
  msgEl.textContent = "Checking…";
  try {
    const data = await api("/tools", "GET", null, k);
    key = k;
    store.set(K_KEY, key);
    editOn = false;
    $("editingBadge").hidden = true;
    takeList(data);
    showTools();
    setStatus("");
    msgEl.textContent = "";
    return true;
  } catch (e) {
    msgEl.className = "msg err";
    msgEl.textContent = e instanceof KeyRejected ? "That key wasn't accepted." : "Couldn't check the key: " + e.message + ".";
    return false;
  }
}

$("gateForm").addEventListener("submit", e => {
  e.preventDefault();
  tryKey($("gateKey").value, $("gateMsg"));
});

/* ---------- settings ---------- */
$("openSettings").addEventListener("click", () => {
  $("access").innerHTML = isAdmin()
    ? "This device has the <b class=\"admin\">admin key</b>."
    : "This device has the <b>viewing key</b>.";
  $("editToggleRow").hidden = !isAdmin();
  $("editToggle").checked = editOn;
  $("newKey").value = "";
  $("keyMsg").textContent = "";
  $("settings").showModal();
});

$("editToggle").addEventListener("change", e => setEdit(e.target.checked));
$("editingBadge").addEventListener("click", () => setEdit(false));

$("keyForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (await tryKey($("newKey").value, $("keyMsg"))) $("settings").close();
});

$("forget").addEventListener("click", () => {
  if (!confirm("Forget the key on this device? You'll need to enter it again to see the apps.")) return;
  forget();
  $("settings").close();
  showGate();
});

document.querySelectorAll("[data-close]").forEach(b =>
  b.addEventListener("click", () => b.closest("dialog").close()));

/* ---------- add / edit ---------- */
function openEditor(t) {
  editing = t;
  pendingImage = undefined;
  $("editorTitle").textContent = t ? "Edit " + t.name : "Add app";
  $("fName").value = t ? t.name : "";
  $("fUrl").value = t ? t.url : "";
  $("fDesc").value = t ? t.description || "" : "";
  $("fIcon").value = t ? t.icon || "" : "";
  $("delTool").hidden = !t;
  $("editMsg").textContent = "";
  const cached = t && t.imgAt ? store.get(K_IMG + t.id, null) : null;
  showPreview(cached ? cached.data : null);
  $("editor").showModal();
}

function showPreview(dataUrl) {
  const p = $("preview");
  p.replaceChildren();
  if (dataUrl) {
    const img = document.createElement("img");
    img.src = dataUrl;
    img.alt = "Screenshot preview";
    p.append(img);
  } else {
    p.textContent = "No screenshot";
  }
}

/* Shrink to 800px wide before upload. A phone screenshot is a few MB; this
   brings it to roughly 30-80 KB, which KV holds without fuss and loads fast
   over a poor connection. WebP where the browser can make it, else JPEG. */
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 800 / bmp.width);
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale);
  c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const toBlob = (type, q) => new Promise(res => c.toBlob(res, type, q));
  let blob = await toBlob("image/webp", 0.8);
  if (!blob || blob.type !== "image/webp") blob = await toBlob("image/jpeg", 0.82);
  return blobToDataUrl(blob);
}

async function takeImage(file) {
  if (!file || !file.type.startsWith("image/")) return;
  $("editMsg").className = "msg";
  $("editMsg").textContent = "Preparing screenshot…";
  try {
    pendingImage = await shrink(file);
    showPreview(pendingImage);
    $("editMsg").textContent = "";
  } catch (_) {
    $("editMsg").className = "msg err";
    $("editMsg").textContent = "Couldn't read that image.";
  }
}

$("pickImg").addEventListener("click", () => $("fFile").click());
$("fFile").addEventListener("change", e => { takeImage(e.target.files[0]); e.target.value = ""; });
$("clearImg").addEventListener("click", () => { pendingImage = null; showPreview(null); });
$("editor").addEventListener("paste", e => {
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith("image/"));
  if (item) { e.preventDefault(); takeImage(item.getAsFile()); }
});

function newId(name) {
  const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30) || "app";
  return slug + "-" + Math.random().toString(36).slice(2, 6);
}

$("toolForm").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("fName").value.trim();
  const body = {
    name,
    url: $("fUrl").value.trim(),
    description: $("fDesc").value.trim(),
    icon: $("fIcon").value.trim()
  };
  if (pendingImage !== undefined) body.image = pendingImage;
  const id = editing ? editing.id : newId(name);

  $("saveTool").disabled = true;
  $("editMsg").className = "msg";
  $("editMsg").textContent = "Saving…";
  try {
    const data = await api("/tools/" + encodeURIComponent(id), "PUT", body);
    // Keep the screenshot just uploaded so it doesn't have to come back down.
    if (typeof pendingImage === "string") {
      const saved = (data.tools || []).find(t => t.id === id);
      if (saved) store.set(K_IMG + id, { at: saved.imgAt, data: pendingImage });
    }
    takeList(data);
    $("editor").close();
  } catch (err) {
    $("editMsg").className = "msg err";
    $("editMsg").textContent = "Not saved: " + err.message + ".";
  } finally {
    $("saveTool").disabled = false;
  }
});

$("delTool").addEventListener("click", async () => {
  if (!editing || !confirm("Remove " + editing.name + " from Offshore Tools?")) return;
  try {
    takeList(await api("/tools/" + encodeURIComponent(editing.id), "DELETE"));
    $("editor").close();
  } catch (err) {
    $("editMsg").className = "msg err";
    $("editMsg").textContent = "Not removed: " + err.message + ".";
  }
});

/* ---------- start ---------- */
refresh();
document.addEventListener("visibilitychange", () => { if (!document.hidden && key) refresh(); });

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
