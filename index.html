<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offshore Tools</title>
  <meta name="description" content="A collection of handy offshore tools: calendars, ship ETAs, timers and more.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
  <style>
    :root {
      --bg: #f3f6f9;
      --surface: #ffffff;
      --text: #0f2233;
      --muted: #5a6b7b;
      --border: #dde4ea;
      --accent: #0b6e99;
      --accent-soft: #e3f1f8;
      --header-from: #0a3d62;
      --header-to: #0b6e99;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1620;
        --surface: #12212e;
        --text: #e6eef5;
        --muted: #93a7b8;
        --border: #1f3445;
        --accent: #4fb3e0;
        --accent-soft: #15344a;
        --header-from: #06243a;
        --header-to: #0a4a6b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: linear-gradient(135deg, var(--header-from), var(--header-to));
      color: #fff;
      padding: 48px 16px 64px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -0.02em; }
    header p { margin: 8px 0 0; opacity: 0.85; }
    main {
      max-width: 1000px;
      margin: -32px auto 0;
      padding: 0 16px 48px;
    }
    .search {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }
    .search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      border-color: var(--accent);
      outline: none;
    }
    .icon {
      width: 52px; height: 52px;
      display: grid; place-items: center;
      font-size: 28px;
      border-radius: 12px;
      background: var(--accent-soft);
    }
    .icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
    .card h2 { margin: 0; font-size: 1.1rem; }
    .card p { margin: 0; color: var(--muted); font-size: 0.92rem; flex: 1; }
    .open { color: var(--accent); font-weight: 600; font-size: 0.9rem; }
    .empty { text-align: center; color: var(--muted); padding: 32px 0; display: none; }
    footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 24px 16px; }
  </style>
</head>
<body>
  <header>
    <h1>⚓ Offshore Tools</h1>
    <p>Pick a tool to get started</p>
  </header>

  <main>
    <input class="search" type="search" placeholder="Search tools…" aria-label="Search tools">
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty">No tools match your search.</p>
  </main>

  <footer>Offshore Tools</footer>

  <script>
    // ── Add, remove or edit your tools here ──────────────────────────────
    // icon:  an emoji, OR an image path/URL (e.g. "images/calendar.png")
    // url:   where the card links to
    const TOOLS = [
      { name: "Rotation Calendar", icon: "📅", url: "#", description: "Plan swings, crew changes and days on/off." },
      { name: "Ship ETA",          icon: "🚢", url: "#", description: "Estimate vessel arrival times from distance and speed." },
      { name: "Timers",            icon: "⏱️", url: "#", description: "Countdown and interval timers for jobs on deck." },
    ];
    // ─────────────────────────────────────────────────────────────────────

    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const isImage = (s) => /[./]/.test(s);

    for (const t of TOOLS) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = t.url;
      a.dataset.search = (t.name + " " + t.description).toLowerCase();

      const icon = document.createElement("div");
      icon.className = "icon";
      if (isImage(t.icon)) {
        const img = document.createElement("img");
        img.src = t.icon;
        img.alt = "";
        icon.append(img);
      } else {
        icon.textContent = t.icon;
      }

      const h = document.createElement("h2");
      h.textContent = t.name;
      const p = document.createElement("p");
      p.textContent = t.description;
      const open = document.createElement("span");
      open.className = "open";
      open.textContent = "Open →";

      a.append(icon, h, p, open);
      grid.append(a);
    }

    document.querySelector(".search").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      let shown = 0;
      for (const card of grid.children) {
        const match = card.dataset.search.includes(q);
        card.style.display = match ? "" : "none";
        if (match) shown++;
      }
      empty.style.display = shown ? "none" : "block";
    });
  </script>
</body>
</html>
